  --kd-border-radius-extra-large: 12px;
  --kd-border-radius-circle:      999px;

  /* ══ Icon Stroke ═════════════════════════════════════════════════ */

  --kd-stroke-width-icon-regular: 1;
  --kd-stroke-width-icon-bold:    1.2;

  /* ══ Transitions ═════════════════════════════════════════════════ */

  --kd-all-transition:          all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
  --kd-fade-transition:         opacity 300ms cubic-bezier(0.23, 1, 0.32, 1);
  --kd-fade-linear-transition:  opacity 200ms linear;

  --kd-border-transition-base:  border-color 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);
  --kd-color-transition-base:   color 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);

  /* ══ Z-Index ═════════════════════════════════════════════════════ */

  --kd-z-index-invisible: -100;

  --kd-z-index-popupmenu: 1040;

  /* ══ Opacity & Custom ════════════════════════════════════════════ */

  /* ══ Backward-Compatible Aliases ═════════════════════════════════

  --kd-font-size-xs:  var(--kd-font-size-extra-small);
  --kd-font-size-xl:  var(--kd-font-size-extra-large);

  --kd-time-fast:   120ms;

  --kd-easing-ease: cubic-bezier(.25, .10, .25, 1.00);
}

/* @kd-registry: reset v2.0 */
/* ══════════════════════════════════════════════════════════════
   KDesign 全局重置
   ══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: var(--kd-font-size-base);
  color: var(--kd-color-text-primary);
  background: var(--kd-color-background-base);
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
button { border: none; background: transparent; font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { min-width: 0; max-width: 100%; }
img, video, canvas, svg { max-width: 100%; }

/* @kd-registry: button v2.0 */
/* ══ Button 按钮 ══ */

.kd-button {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: inherit; font-weight: var(--kd-font-weight-regular);
  line-height: var(--kd-line-height-base);
  border: 1px solid transparent; border-radius: var(--kd-border-radius-middle);
  cursor: pointer; white-space: nowrap; user-select: none; outline: none;
  transition: background var(--kd-time-fast) var(--kd-easing-ease),
              border-color var(--kd-time-fast) var(--kd-easing-ease),
              color var(--kd-time-fast) var(--kd-easing-ease);
}
.kd-button-children { display: inline-flex; align-items: center; }
.kd-button-prefix-icon { margin-right: 4px; font-size: 16px; display: inline-flex; }
.kd-button-suffix-icon { margin-left: 4px; font-size: 16px; display: inline-flex; }

/* Size */
.kd-button-sm { height: 24px; padding: 0 5px;    font-size: var(--kd-font-size-sub-base); border-radius: var(--kd-border-radius-small); }
.kd-button-m  { height: 28px; padding: 2px 11px; font-size: var(--kd-font-size-sub-base); }
.kd-button-lg { height: 32px; padding: 4px 15px; font-size: var(--kd-font-size-sub-base); }
.kd-button-xl { height: 36px; padding: 6px 19px; font-size: var(--kd-font-size-middle); }
.kd-button-light.kd-button-m { padding: 2px 8px; }

/* Primary */
.kd-button-primary { background: var(--kd-color-public-normal); color: var(--kd-color-text-white); }
.kd-button-primary:hover:not(:disabled) { background: var(--kd-color-public-hover); }
.kd-button-primary:active:not(:disabled) { background: var(--kd-color-public-pressed); }

/* Secondary */
.kd-button-secondary { background: var(--kd-color-fill-base); color: var(--kd-color-text-primary); border-color: var(--kd-color-fill-heavy); }
.kd-button-secondary:hover:not(:disabled)  { background: var(--kd-color-fill-light); }
.kd-button-secondary:active:not(:disabled) { background: var(--kd-color-fill-regular); }

/* Light */
.kd-button-light { background: transparent; color: var(--kd-color-text-primary); }
.kd-button-light:hover:not(:disabled)  { background: var(--kd-color-state-hover); }
.kd-button-light:active:not(:disabled) { background: var(--kd-color-state-pressed); }

/* Danger */
.kd-button-light.kd-button-danger  { color: var(--kd-color-error-normal); }
.kd-button-primary.kd-button-danger { background: var(--kd-color-error-normal); }
.kd-button-primary.kd-button-danger:hover:not(:disabled)  { background: var(--kd-color-error-hover); }
.kd-button-primary.kd-button-danger:active:not(:disabled) { background: var(--kd-color-error-pressed); }

/* Disabled */
.kd-button:disabled { opacity: var(--kd-opacity-disabled); cursor: not-allowed; pointer-events: none; }

/* Icon-only */
.kd-button-icon.kd-button-sm { min-width: 24px; padding: 3px; }
.kd-button-icon.kd-button-m  { min-width: 28px; padding: 5px; }
.kd-button-icon.kd-button-lg { min-width: 32px; padding: 7px; }
.kd-button-icon.kd-button-xl { min-width: 36px; padding: 9px; }

/* @kd-registry: input v2.0 */
/* ══ Input 输入框 ══ */

.kd-input-wrap {
  display: inline-flex; align-items: center; width: 100%;
  background: var(--kd-color-fill-base);
  border: 1px solid var(--kd-color-line-regular);
  border-radius: var(--kd-border-radius-middle);
  padding: 0 4px 0 8px;
  transition: border-color var(--kd-time-fast);
  box-sizing: border-box;
}
.kd-input-wrap > * + * { margin-left: 8px; }

/* Hover / Focus / Error / Disabled */
.kd-input:hover:not(.is-disabled):not(.kd-input-status-error) .kd-input-wrap { border-color: var(--kd-color-line-medium); }
.kd-input.is-focus .kd-input-wrap,
.kd-input-wrap:focus-within { border-color: var(--kd-color-line-public) !important; }
.kd-input-status-error .kd-input-wrap { border-color: var(--kd-color-error-normal) !important; box-shadow: none; }
.kd-input.is-disabled .kd-input-wrap { background: var(--kd-color-fill-regular); border-color: var(--kd-color-line-heavy); opacity: var(--kd-opacity-disabled); }

/* Size — min-height on wrap guarantees height even if .kd-input-inner is missing */
.kd-input-small .kd-input-wrap  { border-radius: var(--kd-border-radius-small); min-height: 24px; }
.kd-input-medium .kd-input-wrap { min-height: 28px; }
.kd-input-large .kd-input-wrap  { min-height: 32px; }
.kd-input-x-large .kd-input-wrap { min-height: 36px; }
.kd-input-small .kd-input-inner { height: 22px; padding: 0; }
.kd-input-medium .kd-input-inner { padding: 2px 0; }
.kd-input-large .kd-input-inner  { padding: 4px 0; }
.kd-input-x-large .kd-input-inner { padding: 6px 0; }

/* Inner */
.kd-input-inner {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: var(--kd-font-size-sub-base); color: var(--kd-color-text-primary);
  line-height: var(--kd-line-height-base); padding: 4px 0; min-width: 0;
}
.kd-input-inner::placeholder { color: var(--kd-color-text-tertiary); }
.kd-input-inner:disabled { cursor: not-allowed; color: var(--kd-color-text-tertiary); }

/* Prefix / Suffix (decorative) */
.kd-input-prefix,
.kd-input-suffix {
  flex-shrink: 0; display: flex; align-items: center;
  color: var(--kd-color-icon-secondary);
}
.kd-input-prefix svg,
.kd-input-suffix svg { display: block; width: 16px; height: 16px; }

/* Icon button inside Input (clickable) */
.kd-input-icon {
  flex-shrink: 0; color: var(--kd-color-icon-secondary);
  font-size: var(--kd-font-size-base);
  display: flex; align-items: center;
  border: none; background: transparent;
  padding: 4px; border-radius: var(--kd-border-radius-small); cursor: pointer;
}
.kd-input-icon:hover { color: var(--kd-color-text-secondary); }

/* @kd-registry: progress v2.0 */
/* ══ Progress 进度条 ══ */

.kd-progress { display: flex; align-items: center; }
.kd-progress-line-outer {
  flex: 1; height: 6px;
  background: var(--kd-color-state-hover);
  border-radius: var(--kd-border-radius-circle);
  overflow: hidden;
}
.kd-progress-line-inner {
  height: 100%;
  background: var(--kd-color-public-normal);
  border-radius: var(--kd-border-radius-circle);
  transition: width .3s ease;
}
.kd-progress-text {
  margin-left: 10px;
  font-size: var(--kd-font-size-sub-base); line-height: 20px;
  white-space: nowrap;
}

/* Status */
.kd-progress-success .kd-progress-line-inner { background: var(--kd-color-success-normal); }
.kd-progress-error   .kd-progress-line-inner { background: var(--kd-color-error-normal); }

/* @kd-registry: modal v2.0 */
/* ══ Modal 弹窗 ══ */

/* Mask */
.kd-modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 999;
}
.kd-modal-wrap {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}

/* Shell sizes */
.kd-modal-sm .kd-modal-content { width: 480px; }
.kd-modal-md .kd-modal-content { width: 640px; }
.kd-modal-lg .kd-modal-content { width: 800px; }

/* Content shell (底板色) */
.kd-modal-content {
  background: var(--kd-color-background-plate);
  border: 1px solid var(--kd-color-line-regular);
  border-radius: var(--kd-border-radius-extra-large);
  box-shadow: var(--kd-box-shadow-extra-large);
  box-sizing: border-box;
  animation: kd-modal-in .3s ease forwards;
}
@keyframes kd-modal-in {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Header */
.kd-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 10px 12px 0 16px; gap: 4px;
}
.kd-modal-title {
  font-size: var(--kd-font-size-base); font-weight: var(--kd-font-weight-bold);
  line-height: var(--kd-line-height-base); color: var(--kd-color-text-primary);
}
.kd-modal-close {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent;
  border-radius: var(--kd-border-radius-small); cursor: pointer;
  color: var(--kd-color-icon-secondary);
  transition: background var(--kd-time-fast);
}
.kd-modal-close:hover { background: var(--kd-color-state-hover); }

/* ── C1/C2：内容区直接在底板上 ── */
.kd-modal-body-wrap { padding: 4px 16px 8px; }

/* ── C3：wrap padding 更窄（留给白卡片自身 padding） ── */
.kd-modal-body-wrap-c3 { padding: 0 16px; }

/* Tabs 置于 Header 和白卡片之间（仅 C3b） */
.kd-modal-body-wrap .kd-tabs { padding-bottom: 8px; }

/* ── C3 白色内容卡片 ── */
.kd-modal-body-card {
  background: var(--kd-color-background-bottom);
  border-radius: var(--kd-border-radius-extra-large);
  padding: 12px;
}

/* C3a 多卡片容器 */
.kd-modal-body-multi { display: flex; flex-direction: column; gap: 8px; }
.kd-modal-body-card-c3 { padding: 12px; }

/* Sections */
.kd-modal-section { display: flex; flex-direction: column; gap: 4px; }
.kd-modal-section + .kd-modal-section { margin-top: 16px; }
.kd-modal-section-title {
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-bold);
  line-height: 20px; color: var(--kd-color-text-primary);
}

/* Field label (400, not bold) */
.kd-field-label {
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-regular);
  line-height: 20px; color: var(--kd-color-text-primary);
}

/* Footer */
.kd-modal-footer {
  display: flex; align-items: center;
  gap: 16px; padding: 16px;
  justify-content: flex-end;
}
.kd-modal-footer.has-left { justify-content: space-between; }
.kd-modal-footer-left,
.kd-modal-footer-right { display: flex; align-items: center; gap: 8px; }
.kd-modal-footer-left:empty { display: none; }

/* @kd-registry: navigation-sidebar v2.0 */
/* ══ Navigation 侧边导航（垂直） ══ */

.kd-navigation-vertical .kd-navigation-item {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 4px 0 8px; margin-top: 4px;
  border-radius: var(--kd-border-radius-small);
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-regular);
  line-height: 32px; color: var(--kd-color-text-primary);
  text-decoration: none; border: none; background: transparent;
  cursor: pointer; user-select: none;
  transition: background var(--kd-time-fast);
}
.kd-navigation-vertical .kd-navigation-item:first-child { margin-top: 0; }
.kd-navigation-vertical .kd-navigation-item:hover  { background: var(--kd-color-state-hover); }
.kd-navigation-vertical .kd-navigation-item:active { background: var(--kd-color-state-pressed); }

.kd-navigation-vertical .kd-navigation-item.is-active {
  font-weight: var(--kd-font-weight-bold);
  color: var(--kd-color-public-normal);
  background: var(--kd-color-state-pressed-public);
}

.kd-navigation-vertical .kd-navigation-item.is-disabled {
  cursor: not-allowed; opacity: 0.3;
}

.kd-navigation-item__icon {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.kd-navigation-item__label {
  width: 100%; min-width: 0; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.kd-navigation-item__arrow {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  color: var(--kd-color-icon-secondary);
  transition: transform var(--kd-time-fast);
}

.kd-navigation-vertical .kd-navigation-item--level2 { padding-left: 36px; }
.kd-navigation-vertical .kd-navigation-item--level3 { padding-left: 48px; }
.kd-navigation-vertical .kd-navigation-item--level4 { padding-left: 60px; }

/* @kd-registry: table v2.0 */
/* ══ Table 表格 ══ */

.kd-table {
  position: relative;
  width: 100%; font-size: var(--kd-font-size-base);
  color: var(--kd-color-text-primary); border-radius: 2px 2px 0 0;
}
.kd-table table { width: 100%; border-collapse: collapse; table-layout: fixed; }

/* ── Header ── */
.kd-table-header-tr { height: 36px; background: var(--kd-color-fill-light); }
.kd-table-header-th {
  padding: 0 12px; font-size: var(--kd-font-size-sub-base);
  font-weight: var(--kd-font-weight-regular); color: var(--kd-color-text-primary);
  text-align: left; white-space: nowrap;
}

/* ── Cell ── */
.kd-table-cell {
  padding: 16px 12px; line-height: 24px;
  border-bottom: 1px solid var(--kd-color-fill-light);
  max-height: 56px; overflow: hidden; text-overflow: ellipsis;
}

/* ── Cell alignment ── */
.kd-table-cell-center, .kd-table-header-th.kd-table-cell-center { text-align: center; }
.kd-table-cell-right, .kd-table-header-th.kd-table-cell-right { text-align: right; }

/* ── Row hover ── */
.kd-table-row:hover .kd-table-cell { background: var(--kd-color-state-hover); }
.kd-table-row:hover .kd-table-cell:first-child { border-radius: var(--kd-border-radius-large) 0 0 var(--kd-border-radius-large); }
.kd-table-row:hover .kd-table-cell:last-child  { border-radius: 0 var(--kd-border-radius-large) var(--kd-border-radius-large) 0; }
.kd-table-row:hover .kd-table-cell { border-bottom-color: var(--kd-color-fill-base); }

/* ── Row selected ── */
.kd-table-row.is-selected .kd-table-cell { background: var(--kd-color-state-pressed-public); }

/* ── Row disabled ── */
.kd-table-row.is-disabled { pointer-events: none; }
.kd-table-row.is-disabled .kd-table-cell { opacity: var(--kd-opacity-disabled); color: var(--kd-color-text-secondary); }

/* ══ Bordered variant ══ */
.kd-table-bordered { border: 1px solid var(--kd-color-line-regular); border-radius: var(--kd-border-radius-large); overflow: hidden; }
.kd-table-bordered .kd-table-header-th { border-right: 1px solid var(--kd-color-line-regular); border-bottom: 1px solid var(--kd-color-line-regular); }
.kd-table-bordered .kd-table-header-th:last-child { border-right: none; }
.kd-table-bordered .kd-table-cell { border-right: 1px solid var(--kd-color-fill-light); }
.kd-table-bordered .kd-table-cell:last-child { border-right: none; }
.kd-table-bordered .kd-table-row:hover .kd-table-cell:first-child { border-radius: 0; }
.kd-table-bordered .kd-table-row:hover .kd-table-cell:last-child { border-radius: 0; }

/* ══ Striped variant ══ */
.kd-table-striped .kd-table-row:nth-child(even) .kd-table-cell { background: var(--kd-color-fill-light); }
.kd-table-striped .kd-table-row:nth-child(even):hover .kd-table-cell { background: var(--kd-color-state-hover); }

/* ══ Fixed header ══ */
.kd-table-fixed-header { overflow-y: auto; }
.kd-table-fixed-header .kd-table-header-tr { position: sticky; top: 0; z-index: 2; }
.kd-table-fixed-header .kd-table-header-th { background: var(--kd-color-fill-light); }

/* ══ Hidden header ══ */
.kd-table-no-header thead { display: none; }

/* ══ Selection column ══ */
.kd-table-th-select, .kd-table-cell-select {
  width: 48px; text-align: center; padding: 0 8px;
}

/* ══ Expand column ══ */
.kd-table-cell-expand { width: 40px; text-align: center; padding: 0 8px; }
.kd-table-expand-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; cursor: pointer;
  color: var(--kd-color-text-secondary); font-size: 12px;
  border-radius: var(--kd-border-radius-small); transition: background var(--kd-time-fast);
}
.kd-table-expand-icon:hover { background: var(--kd-color-state-hover); }
.kd-table-expand-icon.is-expanded { color: var(--kd-color-text-primary); }

/* Expanded row */
.kd-table-expanded-row .kd-table-expanded-cell { padding: 0; border-bottom: 1px solid var(--kd-color-fill-light); }
.kd-table-expanded-content { padding: 12px 12px 12px 52px; background: var(--kd-color-fill-light); font-size: var(--kd-font-size-sub-base); line-height: 20px; color: var(--kd-color-text-secondary); }

/* ══ Empty state ══ */
.kd-table-row-empty .kd-table-cell { border-bottom: none; }
.kd-table-empty {
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  padding: 40px 0; color: var(--kd-color-text-placeholder); font-size: var(--kd-font-size-sub-base);
}

/* ══ Loading overlay ══ */
.kd-table-loading { position: relative; }
.kd-table-loading table { opacity: 0.4; pointer-events: none; }
.kd-table-loading-overlay {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.6); border-radius: inherit;
}

/* @kd-registry: message v2.0 */
/* ══ Message 全局提示 ══ */

.kd-message-root {
  position: fixed; top: 88px; left: 50%; transform: translateX(-50%);
  z-index: 9000; display: flex; flex-direction: column; align-items: center;
  gap: 8px; pointer-events: none;
}
.kd-message {
  display: inline-flex; align-items: center;
  padding: 9px 20px; border-radius: var(--kd-border-radius-large);
  border: 1px solid; box-shadow: var(--kd-box-shadow-large);
  font-size: var(--kd-font-size-sub-base); line-height: var(--kd-line-height-base);
  pointer-events: auto;
  animation: kd-toast-in .3s ease forwards;
}
@keyframes kd-toast-in {
  from { opacity: 0; transform: translateY(-90%); }
  to   { opacity: 1; transform: translateY(0); }
}
.kd-message-icon { flex-shrink: 0; display: inline-flex; align-items: center; line-height: 1; }
.kd-message-text { margin-left: 8px; color: var(--kd-color-text-primary); line-height: var(--kd-line-height-base); }

.kd-message-success { background: var(--kd-color-success-light); border-color: var(--kd-color-success-normal); }
.kd-message-error   { background: var(--kd-color-error-light);   border-color: var(--kd-color-error-normal); }
.kd-message-warning { background: var(--kd-color-warning-light); border-color: var(--kd-color-warning-normal); }
.kd-message-info,
.kd-message-loading { background: var(--kd-color-info-light);    border-color: var(--kd-color-public-normal); }

/* @kd-registry: tooltip v3.0 */
/* ══ Tooltip 文字提示 ══ */

.kd-tooltip {
  position: relative; display: inline-flex;
}

.kd-tooltip-content {
  position: absolute; z-index: 1050;
  padding: 6px 12px; border-radius: var(--kd-border-radius-middle);
  border: 1px solid var(--kd-color-line-regular);
  background: var(--kd-color-fill-base);
  box-shadow: var(--kd-box-shadow-large);
  font-size: var(--kd-font-size-sub-base); line-height: 20px;
  color: var(--kd-color-text-primary); max-width: 300px; word-break: break-word;
  white-space: nowrap;
}

/* Arrow: 旋转方块，作为 .kd-tooltip-content 的子元素 */
.kd-tooltip-arrow {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--kd-color-fill-base);
  border: 1px solid var(--kd-color-line-regular);
  transform: rotate(45deg);
}

/* ── Placement: top（箭头在内容框底部） ── */
.kd-tooltip-top .kd-tooltip-content {
  bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
}
.kd-tooltip-top .kd-tooltip-arrow {
  bottom: -5px; left: 50%; margin-left: -4px;
  border-top-color: transparent; border-left-color: transparent;
}

/* ── Placement: bottom（箭头在内容框顶部） ── */
.kd-tooltip-bottom .kd-tooltip-content {
  top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
}
.kd-tooltip-bottom .kd-tooltip-arrow {
  top: -5px; left: 50%; margin-left: -4px;
  border-bottom-color: transparent; border-right-color: transparent;
}

/* ── Placement: left（箭头在内容框右侧，尖端朝右） ── */
.kd-tooltip-left .kd-tooltip-content {
  right: calc(100% + 6px); top: 50%; transform: translateY(-50%);
}
.kd-tooltip-left .kd-tooltip-arrow {
  right: -5px; top: 50%; margin-top: -4px;
  border-bottom-color: transparent; border-left-color: transparent;
}

/* ── Placement: right（箭头在内容框左侧，尖端朝左） ── */
.kd-tooltip-right .kd-tooltip-content {
  left: calc(100% + 6px); top: 50%; transform: translateY(-50%);
}
.kd-tooltip-right .kd-tooltip-arrow {
  left: -5px; top: 50%; margin-top: -4px;
  border-top-color: transparent; border-right-color: transparent;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--kd-color-background-base);
}

.top-info-bar {
  height: 64px;
  padding: 0 16px 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--kd-color-background-base);
}

.top-info-left,
.top-info-right {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.top-search-shell {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  justify-content: center;
}

.top-search-wrap {
  width: 367px;
  max-width: 100%;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  line-height: 30px;
  font-weight: 600;
  color: var(--kd-color-text-primary);
}

.brand-logo {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--kd-color-public-normal);
  color: var(--kd-color-text-white);
  font-size: 14px;
  line-height: 22px;
  font-weight: 600;
}

.user-chip {
  padding: 8px 8px 4px 4px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--kd-radius-md);
}

.user-chip:hover {
  background: var(--kd-color-state-hover);
}

.avatar {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--kd-color-public-light);
  color: var(--kd-color-text-public);
  font-size: 12px;
  line-height: 18px;
  font-weight: 600;
}

.base {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
}

.navigation-shell {
  width: 212px;
  flex: 0 0 212px;
  min-height: 0;
  padding: 0 0 12px;
  display: flex;
  background: var(--kd-color-background-base);
}

.navigation-shell .kd-navigation-vertical {
  width: 180px;
  margin: 0 16px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.navigation-shell .kd-navigation-item {
  width: 100%;
  min-height: 32px;
  border-radius: var(--kd-radius-md);
}

.navigation-shell .kd-navigation-item .kd-icon svg,
.navigation-shell [data-nav-sidebar-toggle-icon] svg {
  stroke-width: 1;
}

.nav-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}

.nav-item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.nav-label {
  flex: 1 1 auto;
  min-width: 0;
  display: inline-flex;
  align-items: center;
}

.nav-item-text {
  min-width: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-align: left;
}

.nav-caret {
  flex: 0 0 auto;
  margin-right: 8px;
  color: var(--kd-color-icon-secondary);
}

.kd-navigation-item.is-active .nav-caret {
  color: currentColor;
}

.nav-group {
  display: flex;
  flex-direction: column;
}

.navigation-shell .nav-group[hidden] {
  display: none;
}

.navigation-shell .nav-group > .kd-navigation-item:first-child {
  margin-top: 4px;
}

.nav-level-2 {
  padding-left: 36px;
}

.nav-level-3 {
  padding-left: 48px;
}

.nav-level-4 {
  padding-left: 60px;
}

.nav-footer {
  padding-top: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.nav-footer-tooltip.kd-tooltip-right .kd-tooltip-content {
  left: calc(100% + 10px);
}

.nav-footer-tooltip.is-tooltip-suppressed .kd-tooltip-content {
  opacity: 0;
  visibility: hidden;
}

.navigation-shell.is-collapsed {
  width: 64px;
  flex-basis: 64px;
}

.navigation-shell.is-collapsed .kd-navigation-vertical {
  width: 32px;
  margin: 0 16px;
}

.navigation-shell.is-collapsed .kd-navigation-item {
  padding-left: 0;
  padding-right: 0;
  justify-content: center;
}

.navigation-shell.is-collapsed .nav-label {
  justify-content: center;
}

.navigation-shell.is-collapsed .kd-navigation-item__icon {
  margin-right: 0;
}

.navigation-shell.is-collapsed .nav-item-text,

  <script>
/**
 * KDesign 组件交互脚本
 * 为 Tabs、Navigation、Select、Checkbox、Radio、Switch 提供点击切换能力
 * 无依赖，事件委托，自动发现组件
 */
;(function () {
  'use strict';

  // ── Tabs 交互 ──
  document.addEventListener('click', function (e) {
    var tabBar = e.target.closest('.kd-tabs-tab-bar');
    if (!tabBar || tabBar.classList.contains('kd-tabs-tab-bar-disabled')) return;

    var nav = tabBar.closest('.kd-tabs-nav-list');
    if (!nav) return;

    var siblings = nav.querySelectorAll('.kd-tabs-tab-bar');
    siblings.forEach(function (t) { t.classList.remove('kd-tabs-tab-bar-active'); });
    tabBar.classList.add('kd-tabs-tab-bar-active');

    var tabsRoot = nav.closest('.kd-tabs');
    if (!tabsRoot) return;

    var index = Array.prototype.indexOf.call(siblings, tabBar);
    var panes = tabsRoot.querySelectorAll('.kd-tabs-pane');
    panes.forEach(function (p, i) {
      p.classList.toggle('kd-tabs-pane-active', i === index);
    });
  });

  // ── Checkbox 交互 ──
  document.addEventListener('change', function (e) {
    var input = e.target;
    if (!input.classList.contains('kd-checkbox-original')) return;
    var wrapper = input.closest('.kd-checkbox-input');
    if (!wrapper) return;
    wrapper.classList.toggle('is-checked', input.checked);
  });

  // ── Radio 交互 ──
  document.addEventListener('change', function (e) {
    var input = e.target;
    if (!input.classList.contains('kd-radio-original')) return;
    var name = input.getAttribute('name');
    if (name) {
      document.querySelectorAll('.kd-radio-original[name="' + name + '"]').forEach(function (r) {
        var w = r.closest('.kd-radio-input');
        if (w) w.classList.remove('is-checked');
      });
    }
    var wrapper = input.closest('.kd-radio-input');
    if (wrapper) wrapper.classList.add('is-checked');
  });

  // ── Switch 交互 ──
  document.addEventListener('change', function (e) {
    var input = e.target;
    if (!input.classList.contains('kd-switch-original')) return;
    var wrapper = input.closest('.kd-switch');
    if (!wrapper) return;
    wrapper.classList.toggle('is-checked', input.checked);
  });

  // ── Navigation 侧边导航交互 ──
  document.addEventListener('click', function (e) {
    var item = e.target.closest('.kd-navigation-item');
    if (!item || item.classList.contains('is-disabled')) return;

    var nav = item.closest('.kd-navigation-vertical');
    if (!nav) return;

    var siblings = nav.querySelectorAll('.kd-navigation-item');
    siblings.forEach(function (n) { n.classList.remove('is-active'); });
    item.classList.add('is-active');
  });

  // ── Select 下拉选择交互 ──

  var CLOSE_SVG = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var TICK_SVG = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5L6.5 11.5L12.5 4.5" stroke="#0A6CFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function getSelectRoot(el) {
    return el.closest('[data-select-mode]');
  }

  function getMode(root) {
    return root.getAttribute('data-select-mode') || 'single';
  }

  function getTrigger(root) {
    return root.querySelector('.kd-select-trigger');
  }

  function getDropdown(root) {
    return root.querySelector('.kd-select-dropdown');
  }

  function getInput(root) {
    return root.querySelector('.kd-input-inner');
  }

  function openSelect(root) {
    var trigger = getTrigger(root);
    var dropdown = getDropdown(root);
    if (!trigger || !dropdown) return;
    trigger.classList.add('is-open');
    dropdown.style.display = '';
  }

  function closeSelect(root) {
    var trigger = getTrigger(root);
    var dropdown = getDropdown(root);
    if (!trigger || !dropdown) return;
    trigger.classList.remove('is-open');
    dropdown.style.display = 'none';
  }

  function closeAllSelects(except) {
    document.querySelectorAll('[data-select-mode]').forEach(function (root) {
      if (root !== except) closeSelect(root);
    });
  }

  function createTag(label, value) {
    var tag = document.createElement('span');
    tag.className = 'kd-select-tag';
    tag.setAttribute('data-tag-value', value);
    tag.textContent = label;
    var btn = document.createElement('button');
    btn.className = 'kd-select-tag-close';
    btn.innerHTML = CLOSE_SVG;
    tag.appendChild(btn);
    return tag;
  }

  function getSelectedValues(root) {
    var tags = root.querySelectorAll('.kd-select-tag');
    var values = [];
    tags.forEach(function (t) { values.push(t.getAttribute('data-tag-value')); });
    return values;
  }

  function syncTicks(root) {
    var selected = getSelectedValues(root);
    var items = root.querySelectorAll('.kd-menu-item');
    items.forEach(function (item) {
      var val = item.getAttribute('data-value');
      var tick = item.querySelector('.kd-menu-item-tick');
      if (selected.indexOf(val) !== -1) {
        item.classList.add('kd-menu-item-selected');
        if (!tick) {
          var span = document.createElement('span');
          span.className = 'kd-menu-item-tick';
          span.innerHTML = TICK_SVG;
          item.insertBefore(span, item.firstChild);
        }
      } else {
        item.classList.remove('kd-menu-item-selected');
        if (tick) tick.remove();
      }
    });
  }

  // 点击触发器 toggle
  document.addEventListener('click', function (e) {
    // 跳过 tag-close 和 clear 按钮的点击
    if (e.target.closest('.kd-select-tag-close') || e.target.closest('.kd-select-clear')) return;

    var trigger = e.target.closest('.kd-select-trigger');
    if (!trigger || trigger.classList.contains('is-disabled')) return;

    var root = getSelectRoot(trigger);
    if (!root) return;

    // 如果点击了 menu-item，不在此处处理 toggle
    if (e.target.closest('.kd-menu-item')) return;

    var dropdown = getDropdown(root);
    if (!dropdown) return;

    var isOpen = trigger.classList.contains('is-open');
    closeAllSelects(root);
    if (isOpen) {
      closeSelect(root);
    } else {
      openSelect(root);
      // 搜索模式：聚焦 input
      if (root.hasAttribute('data-select-searchable')) {
        var input = getInput(root);
        if (input) { input.removeAttribute('readonly'); input.focus(); }
      }
    }
  });

  // 点击外部关闭
  document.addEventListener('click', function (e) {
    if (!e.target.closest('[data-select-mode]')) {
      closeAllSelects(null);
    }
  });

  // 点击选项
  document.addEventListener('click', function (e) {
    var item = e.target.closest('.kd-menu-item');
    if (!item || item.classList.contains('kd-menu-item-disabled')) return;

    var root = getSelectRoot(item);
    if (!root) return;

    var mode = getMode(root);
    var value = item.getAttribute('data-value') || '';
    var label = item.textContent.trim();
    var input = getInput(root);

    if (mode === 'single') {
      // 清除旧 ticks
      root.querySelectorAll('.kd-menu-item').forEach(function (mi) {
        mi.classList.remove('kd-menu-item-selected');
        var tick = mi.querySelector('.kd-menu-item-tick');
        if (tick) tick.remove();
      });
      // 设置选中
      item.classList.add('kd-menu-item-selected');
      var tickSpan = document.createElement('span');
      tickSpan.className = 'kd-menu-item-tick';
      tickSpan.innerHTML = TICK_SVG;
      item.insertBefore(tickSpan, item.firstChild);
      // 更新 input
      if (input) input.value = label;
      closeSelect(root);
      // 标记有值（CSS 控制 hover 时显示 clear、隐藏 arrow）
      root.classList.add('has-value');
    } else {
      // 多选 toggle
      var existing = root.querySelector('.kd-select-tag[data-tag-value="' + value + '"]');
      if (existing) {
        existing.remove();
      } else {
        var tag = createTag(label, value);
        var inputEl = getInput(root);
        if (inputEl) inputEl.parentNode.insertBefore(tag, inputEl);
      }
      syncTicks(root);
    }
  });

  // 点击 Tag 关闭按钮
  document.addEventListener('click', function (e) {
    var closeBtn = e.target.closest('.kd-select-tag-close');
    if (!closeBtn) return;

    var tag = closeBtn.closest('.kd-select-tag');
    if (!tag) return;

    var root = getSelectRoot(tag);
    tag.remove();
    if (root) syncTicks(root);
  });

  // 点击 Clear 按钮
  document.addEventListener('click', function (e) {
    var clearBtn = e.target.closest('.kd-select-clear');
    if (!clearBtn) return;

    var root = getSelectRoot(clearBtn);
    if (!root) return;

    var mode = getMode(root);
    var input = getInput(root);

    if (mode === 'single') {
      if (input) { input.value = ''; }
      root.querySelectorAll('.kd-menu-item').forEach(function (mi) {
        mi.classList.remove('kd-menu-item-selected');
        var tick = mi.querySelector('.kd-menu-item-tick');
        if (tick) tick.remove();
      });
      root.classList.remove('has-value');
    } else {
      root.querySelectorAll('.kd-select-tag').forEach(function (t) { t.remove(); });
      syncTicks(root);
    }
    closeSelect(root);
  });

  // 搜索过滤
  document.addEventListener('input', function (e) {
    var input = e.target;
    if (!input.classList.contains('kd-input-inner')) return;

    var root = getSelectRoot(input);
    if (!root || !root.hasAttribute('data-select-searchable')) return;

    var keyword = input.value.toLowerCase();
    var items = root.querySelectorAll('.kd-menu-item');
    items.forEach(function (item) {
      var text = item.textContent.toLowerCase();
      item.style.display = text.indexOf(keyword) !== -1 ? '' : 'none';
    });

    // 如果面板未打开则打开
    var trigger = getTrigger(root);
    if (trigger && !trigger.classList.contains('is-open')) {
      openSelect(root);
    }
  });

})();

  <script>
(function initAdminConsoleNavigationSidebar() {
  var shell = document.querySelector('.navigation-shell');
  if (!shell) return;

  var collapsedClass = 'is-collapsed';

  function syncNavGroups() {
    var toggleButtons = Array.from(shell.querySelectorAll('[data-nav-toggle]'));
    toggleButtons.forEach(function(toggleBtn) {
      var groupName = toggleBtn.getAttribute('data-nav-toggle');
      var expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
      var group = shell.querySelector('[data-nav-group="' + groupName + '"]');
      var caret = toggleBtn.querySelector('[data-nav-caret]');
      if (group) {
        group.hidden = !expanded || shell.classList.contains(collapsedClass);
      }
      if (caret) {
        caret.style.transform = expanded ? 'rotate(180deg)' : 'rotate(0deg)';
      }
    });
  }

  function syncSidebarToggle() {
    var toggleBtn = shell.querySelector('[data-nav-sidebar-toggle]');
    if (!toggleBtn) return;
    var toggleIcon = toggleBtn.querySelector('[data-nav-sidebar-toggle-icon]');
    var tooltipLabel = shell.querySelector('[data-nav-sidebar-tooltip-label]');
    var collapsed = shell.classList.contains(collapsedClass);

    toggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    toggleBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');

    if (toggleIcon) {
      toggleIcon.style.transform = collapsed ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    if (tooltipLabel) {
      tooltipLabel.textContent = collapsed ? '展开导航' : '收起导航';
    }
  }

  function hideTooltipOnClick() {
    var tooltipWrap = shell.querySelector('.nav-footer-tooltip');
    var toggleBtn = shell.querySelector('[data-nav-sidebar-toggle]');
    if (!tooltipWrap || !toggleBtn) return;

    tooltipWrap.classList.add('is-tooltip-suppressed');
    toggleBtn.blur();

    window.setTimeout(function() {
      tooltipWrap.classList.remove('is-tooltip-suppressed');
    }, 120);
  }

  function bindNavGroups() {
    var toggleButtons = Array.from(shell.querySelectorAll('[data-nav-toggle]'));
    toggleButtons.forEach(function(toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        if (shell.classList.contains(collapsedClass)) return;
        var expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
        toggleBtn.setAttribute('aria-expanded', expanded ? 'false' : 'true');
        syncNavGroups();
      });
    });
  }

  function bindSidebarToggle() {
    var toggleBtn = shell.querySelector('[data-nav-sidebar-toggle]');
    if (!toggleBtn) return;

    toggleBtn.addEventListener('click', function() {
      hideTooltipOnClick();
      shell.classList.toggle(collapsedClass);
      syncSidebarToggle();
      syncNavGroups();
    });
  }

  syncSidebarToggle();
  syncNavGroups();
  bindNavGroups();
  bindSidebarToggle();
})();

</script>

            name: featureName("离职员工文档交接", true),
            cells: [statusCell(false), statusCell(false), statusCell(true), statusCell(true)]
          }
        ];

        var body = rows.map(function (row) {
          if (row.type === "cat") {
            return (
              '<tr class="benefit-cat-row' + (row.muted ? " is-muted" : "") + '">' +
                "<td>" + row.name + "</td>" +
                row.counts.map(function (c) {
                  return '<td><span class="benefit-cat-count">权益项: ' + c + "</span></td>";
                }).join("") +
              "</tr>"
            );
          }
          return (
            "<tr>" +
              "<td>" + row.name + "</td>" +
              row.cells.map(function (c) { return "<td>" + c + "</td>"; }).join("") +
            "</tr>"
          );
        }).join("");

        function planHead(opts) {
          var badgeClass = "benefit-plan-badge";
          if (opts.badgeType === "current") badgeClass += " is-current";
          else if (opts.badgeType === "recommend") badgeClass += " is-recommend";
          else badgeClass += " is-placeholder";
          var badge = '<span class="' + badgeClass + '">' + (opts.badge || "占位") + "</span>";

          var cta = "";
          if (opts.cta === "buy") {
            cta =
              '<!-- [Button: primary medium] -->' +
              '<a class="kd-button kd-button-primary kd-button-m" href="' + buyUrl + '" target="_blank" rel="noopener noreferrer">立即购买</a>';
          } else if (opts.cta === "recommend") {
            cta =
              '<a class="kd-button kd-button-m benefit-btn-recommend" href="' + buyUrl + '" target="_blank" rel="noopener noreferrer">立即购买</a>';
          }

          return (
            '<div class="benefit-plan-head">' +
              badge +
              '<div class="benefit-plan-name">' + opts.name + "</div>" +
              '<div class="benefit-plan-desc">' + opts.desc + "</div>" +
              '<div class="benefit-plan-price">' + opts.price + "</div>" +
              '<div class="benefit-plan-cta">' + cta + "</div>" +
            "</div>"
          );
        }

        return (
          '<!-- [Pattern: benefit-detail] -->' +
          '<section class="benefit-detail" data-kd-pattern="benefit-detail">' +
            '<h2 class="benefit-detail-title">权益明细</h2>' +
            '<div class="benefit-summary">' +
              '<article class="benefit-summary-card">' +
                '<div class="benefit-summary-label">权益组成</div>' +
                '<div class="benefit-summary-body">' +
                  '<div class="benefit-summary-row">我的套餐：WPS 365 体验版 (2027-06-24到期)' + tipInfoIcon + "</div>" +
                  '<div class="benefit-summary-row">' +
                    "我的权益包：截屏管控权益包 (2027-03-25到期)" +
                    '<!-- [Link: primary] -->' +
                    '<button class="kd-link kd-link-primary" type="button" data-act="benefitPackMore">更多 &gt;</button>' +
                  "</div>" +
                "</div>" +
              "</article>" +
              '<article class="benefit-summary-card">' +
                '<div class="benefit-summary-label">权益来源</div>' +
                '<div class="benefit-summary-body">' +
                  '<div class="benefit-summary-row">' +
                    "企业购买：" +
                    '<!-- [Link: primary] -->' +
                    '<button class="kd-link kd-link-primary" type="button" data-act="orderRecord">订单记录 &gt;</button>' +
                  "</div>" +
                "</div>" +
              "</article>" +
            "</div>" +
            '<div class="benefit-compare">' +
              '<table class="benefit-compare-table">' +
                "<colgroup>" +
                  '<col class="col-feature">' +
                  "<col><col><col><col>" +
                "</colgroup>" +
                "<thead><tr>" +
                  "<th>功能</th>" +
                  "<th>我的权益</th>" +
                  "<th>" + planHead({
                    badgeType: "none",
                    name: "商业协作版",
                    desc: "尊享30+项权益",
                    price: "199 元/人/年",
                    cta: "buy"
                  }) + "</th>" +
                  "<th>" + planHead({
                    badgeType: "none",
                    name: "商业高级版",
                    desc: "尊享250+项权益",
                    price: "399 元/人/年",
                    cta: "buy"
                  }) + "</th>" +
                  "<th>" + planHead({
                    badge: "推荐",
                    badgeType: "recommend",
                    name: "商业旗舰版",
                    desc: "尊享300+项权益",
                    price: "599 元/人/年",
                    cta: "recommend"
                  }) + "</th>" +
                "</tr></thead>" +
                "<tbody>" + body + "</tbody>" +
              "</table>" +
            "</div>" +
          "</section>"
        );
      }

      function renderBenefits() {
        var tip =
          '<!-- [MessageBanner: info full] -->' +
          '<div class="page-tip" data-kd-component="MessageBanner" role="status">' +
            '<span class="page-tip-icon">' + infoIcon + "</span>" +
            '<p class="page-tip-text">近期已有 2 名成员自费购买权益，建议升级商业高级版，统一为其他成员开通所需权益</p>' +
            '<div class="page-tip-action">' +
              '<!-- [Link: primary] -->' +
              '<button class="kd-link kd-link-primary" type="button" data-act="selfPayDetail">查看详情</button>' +
              '<!-- [Button: primary medium] -->' +
              '<a class="kd-button kd-button-primary kd-button-m" href="' + upgradeUrl + '" target="_blank" rel="noopener noreferrer">立即升级</a>' +
            "</div>" +
          "</div>";
        return (
          '<div class="benefit-usage">' +
            tip +
            '<section class="quota-grid" data-kd-pattern="quota-cards">' +
              quotas.map(function (q) {
                var status = q.percent >= 90 ? " kd-progress-error" : "";
                var btns = q.actions.map(function (a) {
                  if (a.href) {
                    return '<a class="kd-button kd-button-secondary kd-button-m" href="' + a.href + '" target="_blank" rel="noopener noreferrer">' + a.label + "</a>";
                  }
                  return '<button class="kd-button kd-button-secondary kd-button-m" type="button" data-act="' + a.act + '" data-sku="' + (a.sku || q.id) + '">' + a.label + "</button>";
                }).join("");
                return (
                  '<article class="quota-card">' +
                    '<div class="quota-card-head">' + q.icon + '<div class="quota-card-title">' + q.title + "</div></div>" +
                    '<div class="quota-card-label">' + q.label + "</div>" +
                    '<div class="quota-card-metric">' + q.display + "</div>" +
                    '<div class="quota-card-progress">' +
                      '<!-- [Progress: line ' + q.percent + '%] -->' +
                      '<div class="kd-progress kd-progress-line' + status + '">' +
                        '<div class="kd-progress-line-outer"><div class="kd-progress-line-inner" style="width:' + q.percent + '%"></div></div>' +
                      "</div>" +
                    "</div>" +
                    '<div class="quota-card-actions">' + btns + "</div>" +
                  "</article>"
                );
              }).join("") +
            "</section>" +
          "</div>" +
          renderBenefitDetail()
        );
      }

      function renderCrumbs(items) {
        var html = "";
        items.forEach(function (text, i) {
          if (i > 0) html += arrowRight;
          if (i === items.length - 1) {
            html += '<span class="breadcrumb-current">' + text + "</span>";
          } else {
            html += "<span>" + text + "</span>";
          }
        });
        return html;
      }

      function setPage(name) {
        var page = pages[name] || pages.benefits;
        currentPage = pages[name] ? name : "benefits";
        document.getElementById("breadcrumb").innerHTML = renderCrumbs(page.crumbs);
        document.getElementById("description-bar").textContent = page.desc;
        document.getElementById("page-actions").innerHTML = page.action
          ? '<!-- [Button: primary large] --><a class="kd-button kd-button-primary kd-button-lg" href="' + upgradeUrl + '" target="_blank" rel="noopener noreferrer">立即升级</a>'
          : "";
        document.getElementById("content-body").innerHTML = page.render();

        document.querySelectorAll(".kd-navigation-item").forEach(function (el) {
          el.classList.remove("is-active");
          el.removeAttribute("aria-current");
        });
        var target = document.querySelector('.kd-navigation-item[data-page="' + currentPage + '"]');
        if (target) {
          target.classList.add("is-active");
          target.setAttribute("aria-current", "page");
        }
      }

      function showMessage(text) {
        var root = document.getElementById("message-root");
        root.innerHTML =
          '<!-- [Message: info] -->' +
          '<div class="kd-message kd-message-info">' +
            '<span class="kd-message-icon">' + infoIcon + "</span>" +
            '<span class="kd-message-text">' + text + "</span>" +
          "</div>";
        clearTimeout(showMessage._t);
        showMessage._t = setTimeout(function () { root.innerHTML = ""; }, 1800);
      }

      function openModal(inner, sizeClass, comment) {
        var root = document.getElementById("modal-root");
        root.className = "kd-modal " + sizeClass;
        root.innerHTML = inner;
        document.getElementById("modal-mask").hidden = false;
        document.getElementById("modal-wrap").hidden = false;
        var closeBtn = root.querySelector("[data-act=close]");
        if (closeBtn) closeBtn.focus();
      }

      function closeModal() {
        document.getElementById("modal-mask").hidden = true;
        document.getElementById("modal-wrap").hidden = true;
        document.getElementById("modal-root").innerHTML = "";
      }

      function modalChrome(title, body, footerRight, extraClass) {
        return (
          '<div class="kd-modal-content">' +
            '<div class="kd-modal-header">' +
              '<div class="kd-modal-title" id="modal-title">' + title + "</div>" +
              '<button class="kd-modal-close" type="button" data-act="close" aria-label="关闭">' + closeIcon + "</button>" +
            "</div>" +
            '<div class="' + (extraClass || "kd-modal-body-wrap") + '">' + body + "</div>" +
            '<div class="kd-modal-footer">' +
              '<div class="kd-modal-footer-right">' + footerRight + "</div>" +
            "</div>" +
          "</div>"
        );
      }

      function footerPair(cancel, confirm, confirmAct) {
        return (
          '<!-- [Button: secondary medium] -->' +
          '<button class="kd-button kd-button-secondary kd-button-m" type="button" data-act="close">' + cancel + "</button>" +
          '<!-- [Button: primary medium] -->' +
          '<button class="kd-button kd-button-primary kd-button-m" type="button" data-act="' + confirmAct + '">' + confirm + "</button>"
        );
      }

      function footerCloseAndBuy(cancel) {
        return (
          '<!-- [Button: secondary medium] -->' +
          '<button class="kd-button kd-button-secondary kd-button-m" type="button" data-act="close">' + cancel + "</button>" +
          '<a class="kd-button kd-button-primary kd-button-m" href="' + buyUrl + '" target="_blank" rel="noopener noreferrer">前往购买</a>'
        );
      }

      function footerCloseAndUpgrade(cancel) {
        return (
          '<!-- [Button: secondary medium] -->' +
          '<button class="kd-button kd-button-secondary kd-button-m" type="button" data-act="close">' + cancel + "</button>" +
          '<a class="kd-button kd-button-primary kd-button-m" href="' + upgradeUrl + '" target="_blank" rel="noopener noreferrer">立即升级</a>'
        );
      }

      function openSelfPayDetail() {
        var body =
          '<!-- [Table: default] -->' +
          '<div class="kd-table">' +
            "<table>" +
              "<thead><tr class=\"kd-table-header-tr\">" +
                '<th class="kd-table-header-th">成员</th>' +
                '<th class="kd-table-header-th">自费权益</th>' +
                '<th class="kd-table-header-th">购买时间</th>' +
              "</tr></thead>" +
              "<tbody>" +
                '<tr class="kd-table-row"><td class="kd-table-cell">张晓晨</td><td class="kd-table-cell">WPS 365 个人超级会员</td><td class="kd-table-cell">2026-07-12</td></tr>' +
                '<tr class="kd-table-row"><td class="kd-table-cell">李思远</td><td class="kd-table-cell">WPS AI 智点加油包</td><td class="kd-table-cell">2026-08-03</td></tr>' +
              "</tbody>" +
            "</table>" +
          "</div>" +
          '<p class="buy-desc">以上成员为个人付费，企业套餐覆盖后可减少重复支出。</p>';
        openModal(
          "<!-- [Modal: md C1] 纯字段型 / 无白卡片 / 自费成员明细 -->" +
          modalChrome("自费购买权益的成员", body, footerCloseAndUpgrade("关闭")),
          "kd-modal-md"
        );
      }

      function openSpaceSource() {
        var body =
          '<!-- [Table: default] -->' +
          '<div class="kd-table">' +
            "<table>" +
              "<thead><tr class=\"kd-table-header-tr\">" +
                '<th class="kd-table-header-th">来源</th>' +
                '<th class="kd-table-header-th">额度</th>' +
                '<th class="kd-table-header-th">有效期</th>' +
              "</tr></thead>" +
              "<tbody>" +
                '<tr class="kd-table-row"><td class="kd-table-cell">体验版套餐赠送</td><td class="kd-table-cell">4 GB</td><td class="kd-table-cell">至 2027-06-24</td></tr>' +
                '<tr class="kd-table-row"><td class="kd-table-cell">加购空间包</td><td class="kd-table-cell">0 GB</td><td class="kd-table-cell">—</td></tr>' +
              "</tbody>" +
            "</table>" +
          "</div>" +
          '<p class="buy-desc">合计可用 4 GB，已使用 349.5 MB。</p>';
        openModal(
          "<!-- [Modal: md C1] 纯字段型 / 无白卡片 / 空间来源表 -->" +
          modalChrome("空间来源", body, footerCloseAndBuy("关闭")),
          "kd-modal-md"
        );
      }

      document.addEventListener("click", function (e) {
        var pageLink = e.target.closest("[data-page]");
        if (pageLink) {
          e.preventDefault();
          setPage(pageLink.getAttribute("data-page"));
          return;
        }

        var actBtn = e.target.closest("[data-act]");
        if (!actBtn) {
          if (e.target.id === "modal-mask" || e.target.id === "modal-wrap") closeModal();
          return;
        }
        var act = actBtn.getAttribute("data-act");
        if (act === "close") closeModal();
        if (act === "selfPayDetail") openSelfPayDetail();
        if (act === "spaceSource") openSpaceSource();
        if (act === "benefitPackMore") showMessage("权益包列表示意");
        if (act === "orderRecord") showMessage("订单记录示意");
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeModal();
      });

      document.querySelector(".navigation-shell").addEventListener("click", function (e) {
        if (!e.target.closest("[data-nav-toggle]")) return;
        window.setTimeout(function () {
          document.querySelectorAll(".kd-navigation-item").forEach(function (el) {
            var on = el.getAttribute("data-page") === currentPage;
            el.classList.toggle("is-active", on);
            if (on) el.setAttribute("aria-current", "page");
            else el.removeAttribute("aria-current");
          });
        }, 0);
      });

      setPage("benefits");
    })();
  </script>
</body>
</html>
