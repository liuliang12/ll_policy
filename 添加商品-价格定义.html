<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>添加商品 - 价格定义</title>
  <style>
    :root { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; color: #262626; background: #f2f3f5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 28px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .page { min-height: 100vh; background: #fff; }
    .header { display: flex; align-items: center; justify-content: space-between; height: 86px; padding: 0 28px; border-bottom: 1px solid #ececec; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; }
    .primary { border: 1px solid #7651f6; border-radius: 7px; background: #7651f6; color: #fff; }
    .primary:hover { background: #6842e8; }
    .back { min-width: 96px; height: 48px; font-size: 18px; }
    .content { max-width: 1500px; margin: auto; padding: 34px 46px 80px; }
    .section-title { display: flex; align-items: center; gap: 20px; margin: 0 0 28px; font-size: 22px; font-weight: 600; }
    .section-title::before { content: ""; width: 52px; height: 1px; background: #e9e9e9; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: #e9e9e9; }
    .default-fields { width: min(100%, 790px); margin: 0 auto 42px; }
    .field { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: start; gap: 16px; margin-bottom: 20px; }
    .field label { padding-top: 11px; text-align: right; font-size: 18px; white-space: nowrap; }
    .required { margin-right: 4px; color: #ff4d4f; }
    .field select, .price-input, .search, .template-select, .dialog-input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #d6d6d6; border-radius: 6px; background: #fff; color: #262626; outline: none; font-size: 17px; }
    .field select:focus, .price-input:focus, .search:focus, .template-select:focus, .dialog-input:focus { border-color: #7651f6; box-shadow: 0 0 0 2px #7651f61c; }
    .price-input[readonly] { cursor: pointer; padding-right: 36px; }
    .input-wrap { position: relative; min-width: 0; }
    .input-wrap.tier::after { content: "⌄"; position: absolute; top: 6px; right: 14px; color: #999; font-size: 25px; pointer-events: none; }
    .input-wrap.custom::after { display: none; }
    .field-note { display: block; padding-top: 6px; color: #999; font-size: 14px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0 0 20px; }
    .section-head .section-title { flex: 1; margin: 0; }
    .template-row { display: flex; align-items: center; gap: 12px; width: min(100%, 790px); margin: 0 auto 22px; }
    .template-row[hidden] { display: none; }
    .template-row label { flex: none; font-size: 17px; }
    .template-select { flex: 1; min-width: 160px; }
    .outline { flex: none; height: 48px; padding: 0 17px; border: 1px solid #d6d6d6; border-radius: 6px; background: #fff; color: #333; font-size: 16px; }
    .outline:hover { border-color: #7651f6; color: #7651f6; }
    .search { margin-bottom: 10px; }
    .table-scroll { overflow-x: auto; border: 1px solid #e8e8e8; border-radius: 7px; }
    table { width: 100%; min-width: 850px; border-collapse: collapse; table-layout: fixed; }
    th, td { border-right: 1px solid #ececec; border-bottom: 1px solid #ececec; text-align: left; }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    th { padding: 17px 15px; background: #fafafa; font-size: 16px; font-weight: 600; }
    td { height: 68px; padding: 8px 15px; font-size: 16px; }
    tbody tr:hover { background: #fcfbff; }
    td .price-input { height: 43px; font-size: 16px; }
    .convert { padding: 4px 0; border: 0; background: transparent; color: #7651f6; font-size: 15px; text-align: left; }
    #future-editor .convert { white-space: nowrap; }
    .convert:hover { text-decoration: underline; }
    .empty { padding: 25px; color: #999; text-align: center; }
    .tier-menu { position: fixed; z-index: 20; width: 180px; max-height: 250px; overflow-y: auto; padding: 5px; border: 1px solid #e5e5e5; border-radius: 6px; background: #fff; box-shadow: 0 8px 24px #0002; }
    .tier-menu[hidden] { display: none; }
    .tier-menu button { display: block; width: 100%; padding: 9px 11px; border: 0; border-radius: 4px; background: #fff; color: #333; font-size: 15px; text-align: left; }
    .tier-menu button:hover, .tier-menu button.selected { background: #f3eeff; color: #7651f6; }
    .footer { position: sticky; bottom: 0; display: flex; justify-content: center; gap: 16px; padding: 18px 20px; border-top: 1px solid #ececec; background: #fff; }
    .step { min-width: 220px; height: 48px; padding: 0 18px; border-radius: 7px; font-size: 17px; }
    .toast { position: fixed; z-index: 40; left: 50%; bottom: 90px; transform: translateX(-50%); padding: 10px 16px; border-radius: 5px; background: #292929; color: #fff; font-size: 14px; box-shadow: 0 5px 18px #0003; }
    .toast[hidden] { display: none; }
    dialog { width: min(440px, calc(100vw - 32px)); padding: 24px; border: 0; border-radius: 8px; box-shadow: 0 16px 50px #0003; }
    dialog::backdrop { background: #0006; }
    dialog h2 { margin: 0 0 16px; font-size: 20px; }
    dialog label { display: block; margin: 0 0 8px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .dialog-actions button { min-width: 75px; height: 38px; }
    .plan-panel { margin-bottom: 32px; padding: 26px 28px 30px; border: 1px solid #e6e6e9; border-radius: 10px; background: #fff; }
    .plan-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .plan-panel-head h2 { margin: 0; font-size: 23px; font-weight: 600; }
    .plan-panel-head p { margin: 7px 0 0; color: #858585; font-size: 14px; }
    .future-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 42px 0 18px; }
    .future-heading h2 { margin: 0; font-size: 23px; }
    .future-heading p { margin: 7px 0 0; color: #858585; font-size: 14px; }
    .future-list { display: grid; gap: 20px; }
    .future-meta { width: min(100%, 790px); margin: 0 auto 32px; }
    .future-meta input[type=date] { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #d6d6d6; border-radius: 6px; background: #fff; color: #262626; font-size: 17px; }
    .future-meta input[type=date]:focus { outline: none; border-color: #7651f6; box-shadow: 0 0 0 2px #7651f61c; }
    .scope-options { display: flex; flex-wrap: wrap; gap: 14px 24px; min-height: 48px; align-items: center; }
    .scope-options label { display: inline-flex; align-items: center; gap: 8px; padding: 0; color: #999; font-size: 16px; text-align: left; white-space: normal; cursor: not-allowed; }
    .scope-options input { accent-color: #7651f6; width: 17px; height: 17px; }
    .field-error { display: block; min-height: 19px; padding-top: 5px; color: #d4380d; font-size: 13px; }
    .future-meta input.invalid { border-color: #d4380d; }
    .remove-plan { border: 0; background: transparent; color: #d4380d; font-size: 15px; white-space: nowrap; }
    .remove-plan:hover { text-decoration: underline; }
    .future-empty { padding: 25px; border: 1px dashed #d9d9d9; border-radius: 8px; background: #fafafa; color: #888; text-align: center; }
    #add-future { height: 44px; padding: 0 18px; border-radius: 6px; font-size: 15px; white-space: nowrap; }
    .future-table { border: 1px solid #e8e8e8; border-radius: 7px; overflow-x: auto; }
    .future-table table { min-width: 620px; }
    .future-table th, .future-table td { padding: 16px 18px; height: auto; }
    .future-actions { display: flex; gap: 16px; }
    .link-button { border: 0; background: transparent; color: #7651f6; font-size: 15px; padding: 0; }
    .link-button.delete { color: #d4380d; }
    #future-dialog { width: min(1180px, calc(100vw - 40px)); max-height: 92vh; overflow-y: auto; padding: 28px; }
    #future-dialog-title { margin-bottom: 22px; font-size: 22px; }
    #future-editor .section-title { font-size: 18px; }
    #future-editor { max-height: calc(92vh - 150px); overflow-y: auto; }
    #future-dialog .dialog-actions { justify-content: center; }
    #future-dialog .dialog-actions button { min-width: 112px; height: 42px; }
    #future-editor.plan-panel { margin: 0; padding: 0; border: 0; border-radius: 0; }
    #future-editor .future-meta { width: min(100%, 790px); margin-top: 0; }
    #future-editor table col:nth-child(1) { width: 16% !important; }
    #future-editor table col:nth-child(2), #future-editor table col:nth-child(3) { width: 8% !important; }
    #future-editor table col:nth-child(4), #future-editor table col:nth-child(5) { width: 16% !important; }
    #future-editor table col:nth-child(6) { width: 17% !important; }
    #future-editor table col:nth-child(7) { width: 19% !important; }
    #future-editor table { min-width: 1050px; }
    #future-detail-dialog { width: min(1050px, calc(100vw - 40px)); max-height: 92vh; padding: 28px; }
    #future-detail-dialog h2 { margin-bottom: 24px; font-size: 22px; }
    #future-detail-content { max-height: calc(92vh - 150px); overflow-y: auto; }
    .detail-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin-bottom: 28px; }
    .detail-item { display: flex; gap: 12px; font-size: 16px; line-height: 1.6; }
    .detail-item span:first-child { flex: none; color: #777; }
    .detail-heading { margin: 24px 0 14px; font-size: 18px; font-weight: 600; }
    #future-detail-dialog table { min-width: 880px; }
    #future-detail-dialog .dialog-actions { justify-content: center; }
    #future-detail-dialog .dialog-actions button { min-width: 112px; height: 42px; }
    @media (max-width: 760px) {
      body { padding: 0; }
      .header { height: 68px; padding: 0 18px; }
      h1 { font-size: 22px; }
      .back { height: 40px; min-width: 70px; font-size: 15px; }
      .content { padding: 24px 16px 55px; }
      .section-title { gap: 10px; font-size: 19px; }
      .section-title::before { width: 18px; }
      .field { grid-template-columns: 1fr; gap: 7px; margin-bottom: 18px; }
      .field label { padding: 0; text-align: left; font-size: 15px; }
      .field select, .price-input, .search, .template-select { height: 43px; font-size: 15px; }
      .section-head { align-items: stretch; flex-direction: column; }
      .template-row { flex-wrap: wrap; margin-top: 22px; }
      .template-row label { width: 100%; }
      .outline { height: 43px; font-size: 14px; }
      .footer { gap: 9px; padding: 12px; }
      .step { min-width: 0; width: 50%; height: 44px; padding: 0 6px; font-size: 13px; }
      .plan-panel { padding: 20px 16px; }
      .plan-panel-head h2, .future-heading h2 { font-size: 20px; }
      .future-heading { align-items: flex-start; flex-direction: column; }
      .future-meta input[type=date] { height: 43px; font-size: 15px; }
      .detail-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header"><h1>添加商品</h1><button class="primary back" id="back" type="button">返回</button></header>
    <div class="content">
      <section class="plan-panel" aria-labelledby="current-title">
        <div class="plan-panel-head"><div><h2 id="current-title">当前价格</h2><p>当前生效的商品价格配置</p></div></div>
        <div id="current-plan"></div>
      </section>
      <div class="future-heading"><h2>未来价格计划</h2><button class="primary" id="add-future" type="button">＋ 添加未来价格计划</button></div>
      <div class="future-list" id="future-list"></div>
    </div>
    <footer class="footer"><button class="outline step" id="previous" type="button">上一步，填写商品信息</button><button class="primary step" id="next" type="button">下一步，设置商品状态</button></footer>
  </main>
  <div class="tier-menu" id="tier-menu" hidden></div>
  <dialog id="future-dialog"><h2 id="future-dialog-title">添加未来价格计划</h2><div id="future-editor"></div><div class="dialog-actions"><button class="outline" id="future-cancel" type="button">取消</button><button class="primary" id="future-save" type="button">保存计划</button></div></dialog>
  <dialog id="future-detail-dialog"><h2>未来价格计划详情</h2><div id="future-detail-content"></div><div class="dialog-actions"><button class="primary" id="future-detail-close" type="button">关闭</button></div></dialog>
  <dialog id="template-dialog"><h2>保存商品价格模板</h2><label for="template-name">模板名称</label><input class="dialog-input" id="template-name" placeholder="请输入模板名称"><div class="dialog-actions"><button class="outline" id="template-cancel" type="button">取消</button><button class="primary" id="template-confirm" type="button">保存</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    const currencies = {
      CNY: { symbol: '¥', tiers: [1, 3, 6, 8, 12, 15, 18, 25, 30, 40, 50, 68, 98, 128, 198] },
      TWD: { symbol: 'NT$', tiers: [30, 60, 90, 120, 150, 170, 220, 250, 300, 390, 490, 690, 990] },
      HKD: { symbol: 'HK$', tiers: [3, 6, 8, 12, 14, 18, 25, 28, 38, 48, 68, 88, 128] },
      USD: { symbol: '$', tiers: [0.99, 1.99, 2.99, 3.99, 4.99, 5.99, 6.99, 8.99, 9.99, 12.99, 19.99] },
      JPY: { symbol: '¥', tiers: [100, 200, 300, 400, 500, 600, 800, 1000, 1500, 2000, 3000] },
      EUR: { symbol: '€', tiers: [0.99, 1.99, 2.99, 3.99, 4.99, 5.99, 7.99, 9.99, 14.99, 19.99] }
    };
    const regions = [
      { name: '中国大陆', code: 'CNY', original: '15.00', actual: '12.00' },
      { name: '中国台湾', code: 'TWD', original: '70.00', actual: '56.00' },
      { name: '中国香港', code: 'HKD', original: '18.00', actual: '14.00' },
      { name: '中国澳门', code: 'USD', original: '2.17', actual: '1.74' },
      { name: '美国', code: 'USD', original: '2.99', actual: '1.99' },
      { name: '日本', code: 'JPY', original: '300.00', actual: '200.00' },
      { name: '德国', code: 'EUR', original: '2.99', actual: '1.99' }
    ];
    const defaultPrices = { CNY: { original: '15.00', actual: '12.00' } };
    const currentPlan = { baseCurrency: 'CNY', defaults: defaultPrices, regions, search: '' };
    const futurePlans = [];
    const templateKey = 'product-price-templates-demo';
    const dataKey = 'product-prices-demo';
    const mode = 'tier';
    let activeInput = null;
    let toastTimer;
    const menu = document.getElementById('tier-menu');
    let activePlan = currentPlan;

    function say(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.hidden = true, 2500); }
    function format(value) { const number = Number(value); return Number.isFinite(number) && value !== '' ? number.toFixed(2) : ''; }
    function closeMenu() { menu.hidden = true; activeInput = null; }
    function openMenu(input, code, model, key) {
      if (mode !== 'tier') return;
      activeInput = input; menu.replaceChildren();
      currencies[code].tiers.forEach(value => {
        const formatted = format(value);
        const option = document.createElement('button'); option.type = 'button'; option.textContent = currencies[code].symbol + formatted;
        if (model[key] === formatted) option.className = 'selected';
        option.addEventListener('click', () => { model[key] = formatted; input.value = formatted; closeMenu(); saveDraft(); });
        menu.append(option);
      });
      const rect = input.getBoundingClientRect();
      menu.style.width = Math.max(180, Math.min(rect.width, 280)) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - Math.max(180, Math.min(rect.width, 280)) - 8) + 'px';
      menu.hidden = false;
      menu.style.top = (rect.bottom + 255 > window.innerHeight ? Math.max(8, rect.top - Math.min(menu.scrollHeight, 250) - 4) : rect.bottom + 4) + 'px';
    }
    function priceField(model, key, code, id) {
      const wrap = document.createElement('div'); wrap.className = 'input-wrap ' + mode;
      const input = document.createElement('input'); input.className = 'price-input'; input.id = id; input.type = 'text'; input.inputMode = 'decimal'; input.value = model[key]; input.placeholder = '请选择价格档位';
      input.setAttribute('aria-label', (key === 'original' ? '商品原价' : '实际价格') + ' ' + code);
      input.readOnly = mode === 'tier';
      input.addEventListener('click', () => openMenu(input, code, model, key));
      wrap.append(input); return wrap;
    }
    function renderDefaults(plan, root, index) {
      const code = plan.baseCurrency;
      if (!plan.defaults[code]) plan.defaults[code] = { original: '', actual: '' };
      root.querySelector('.default-original-wrap').replaceChildren(priceField(plan.defaults[code], 'original', code, 'default-original-' + index));
      root.querySelector('.default-actual-wrap').replaceChildren(priceField(plan.defaults[code], 'actual', code, 'default-actual-' + index));
    }
    function renderRows(plan, tbody, search) {
      tbody.replaceChildren();
      const showCurrentPrice = Boolean(tbody.closest('#future-editor'));
      const query = search.value.trim().toLowerCase();
      const visible = plan.regions.filter(row => row.name.toLowerCase().includes(query) || row.code.toLowerCase().includes(query));
      if (!visible.length) { const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = showCurrentPrice ? 7 : 6; td.className = 'empty'; td.textContent = '没有匹配的地区'; tr.append(td); tbody.append(tr); return; }
      visible.forEach((row, index) => {
        const tr = document.createElement('tr');
        for (const value of [row.name, row.code, currencies[row.code].symbol]) { const td = document.createElement('td'); td.textContent = value; tr.append(td); }
        for (const key of ['original', 'actual']) { const td = document.createElement('td'); td.append(priceField(row, key, row.code, 'region-' + index + '-' + key)); tr.append(td); }
        if (showCurrentPrice) {
          const currentRow = currentPlan.regions.find(item => item.name === row.name);
          const currentActual = currentRow && currentRow.actual;
          const fallback = currentPlan.defaults[currentPlan.baseCurrency]?.actual;
          const td = document.createElement('td');
          td.textContent = currentActual || fallback || '未设置';
          tr.append(td);
        }
        const action = document.createElement('td'); const convert = document.createElement('button'); convert.type = 'button'; convert.className = 'convert'; convert.textContent = '按汇率转化地区价格';
        convert.addEventListener('click', () => { const rate = { CNY: 1, TWD: 4.5, HKD: 1.1, USD: 0.14, JPY: 21, EUR: 0.13 }[row.code]; const base = plan.defaults.CNY || {}; if (!base.actual) return say('请先填写人民币默认价格'); row.original = base.original ? format(Number(base.original) * rate) : ''; row.actual = format(Number(base.actual) * rate); renderRows(plan, tbody, search); saveDraft(); say('地区价格已转换'); });
        action.append(convert); tr.append(action); tbody.append(tr);
      });
    }
    function saveDraft() { localStorage.setItem(dataKey, JSON.stringify({ mode, baseCurrency: currentPlan.baseCurrency, defaultPrices: currentPlan.defaults, regions: currentPlan.regions, currentPlan, futurePlans })); }
    function makePlan() {
      return { date: '', scope: 'new', baseCurrency: currentPlan.baseCurrency, defaults: structuredClone(currentPlan.defaults), regions: structuredClone(currentPlan.regions), search: '' };
    }
    function renderPlan(root, plan, index, future) {
      const dialogEditor = root.id === 'future-editor';
      root.className = future ? 'plan-panel' : '';
      if (dialogEditor) root.className = '';
      root.innerHTML = future && !dialogEditor
        ? '<div class="plan-panel-head"><div><h2>未来价格计划</h2><p>配置开始生效日期及适用订阅用户范围</p></div><button type="button" class="remove-plan">删除计划</button></div><div class="future-meta"><div class="field"><label><span class="required">*</span>价格开始生效日期：</label><div><input type="date" class="plan-date"><span class="field-error date-error"></span></div></div><div class="field"><label><span class="required">*</span>价格生效范围：</label><div class="scope-options"><label><input type="radio" name="scope-' + index + '" value="new" checked disabled><span>仅对新订阅用户生效</span></label><label><input type="radio" name="scope-' + index + '" value="all" disabled><span>对新老订阅用户都生效</span></label></div></div></div>'
        : future && dialogEditor
          ? '<div class="future-meta"><div class="field"><label><span class="required">*</span>价格开始生效日期：</label><div><input type="date" class="plan-date"><span class="field-error date-error"></span></div></div><div class="field"><label><span class="required">*</span>价格生效范围：</label><div class="scope-options"><label><input type="radio" name="scope-' + index + '" value="new" checked disabled><span>仅对新订阅用户生效</span></label><label><input type="radio" name="scope-' + index + '" value="all" disabled><span>对新老订阅用户都生效</span></label></div></div></div>'
        : '';
      const config = document.createElement('div');
      config.innerHTML = '<div class="section-head"><h2 class="section-title">预付默认价格</h2></div><div class="default-fields"><div class="field"><label><span class="required">*</span>货币符号：</label><select class="base-currency"><option value="CNY">人民币 (¥)</option><option value="USD">美元 ($)</option><option value="TWD">新台币 (NT$)</option><option value="HKD">港币 (HK$)</option><option value="JPY">日元 (¥)</option><option value="EUR">欧元 (€)</option></select></div><div class="field"><label>商品原价：</label><div class="default-original-wrap"></div></div><div class="field"><label><span class="required">*</span>实际价格：</label><div><div class="default-actual-wrap"></div><span class="field-note">未设置地区价格时，使用默认价格。</span></div></div></div><div class="section-head"><h2 class="section-title">商品价格</h2></div><div class="template-row"><label>选择价格模板：</label><select class="template-select"><option value="">选择一个价格模板</option></select><button class="outline save-template" type="button">保存商品价格模板</button></div><input class="search" type="search" placeholder="搜索国家或地区" aria-label="搜索国家或地区"><div class="table-scroll"><table><colgroup><col style="width:21%"><col style="width:12%"><col style="width:11%"><col style="width:22%"><col style="width:22%"><col style="width:12%"></colgroup><thead><tr><th>地区</th><th>货币代码</th><th>货币符号</th><th>商品原价</th><th>实际价格</th><th>操作</th></tr></thead><tbody class="prices"></tbody></table></div>';
      root.append(config);
      if (dialogEditor) {
        const table = root.querySelector('.table-scroll table');
        const col = document.createElement('col');
        const colgroup = table.querySelector('colgroup'); colgroup.insertBefore(col, colgroup.lastElementChild);
        const heading = document.createElement('th'); heading.textContent = '当前实际价格';
        table.querySelector('thead tr').insertBefore(heading, table.querySelector('thead th:last-child'));
      }
      const currency = root.querySelector('.base-currency'); currency.value = plan.baseCurrency;
      if (future) {
        plan.scope = 'new';
        root.querySelector('.plan-date').value = plan.date || '';
        root.querySelector('.plan-date').addEventListener('change', event => {
          const duplicate = event.target.value && futurePlans.some(item => item !== plan && item.date === event.target.value);
          if (duplicate) { event.target.classList.add('invalid'); root.querySelector('.date-error').textContent = '同一日期只允许有一条价格计划'; plan.date = ''; return say('未来价格计划的开始日期不能重复'); }
          plan.date = event.target.value; event.target.classList.remove('invalid'); root.querySelector('.date-error').textContent = ''; saveDraft();
        });
        const removeButton = root.querySelector('.remove-plan');
        if (removeButton) removeButton.addEventListener('click', () => { futurePlans.splice(futurePlans.indexOf(plan), 1); renderAll(); saveDraft(); });
      }
      root.querySelector('.template-row').hidden = mode !== 'custom';
      const select = root.querySelector('.template-select');
      Object.keys(templates()).forEach(name => select.add(new Option(name, name)));
      select.addEventListener('change', event => {
        const saved = templates()[event.target.value]; if (!saved) return;
        Object.entries(saved.defaults).forEach(([code, values]) => plan.defaults[code] = { ...values });
        saved.regions.forEach(item => { const row = plan.regions.find(region => region.name === item.name); if (row) Object.assign(row, { original: item.original, actual: item.actual }); });
        renderAll(); saveDraft(); say('已应用价格模板');
      });
      root.querySelector('.save-template').addEventListener('click', () => { activePlan = plan; document.getElementById('template-name').value = ''; document.getElementById('template-dialog').showModal(); });
      currency.addEventListener('change', () => { plan.baseCurrency = currency.value; renderAll(); saveDraft(); });
      const search = root.querySelector('.search'); search.value = plan.search || '';
      search.addEventListener('input', () => { plan.search = search.value; renderRows(plan, root.querySelector('.prices'), search); });
      renderDefaults(plan, root, index); renderRows(plan, root.querySelector('.prices'), search);
    }
    function renderAll() {
      const currentRoot = document.getElementById('current-plan'); currentRoot.replaceChildren();
      renderPlan(currentRoot, currentPlan, 0, false);
      const list = document.getElementById('future-list'); list.replaceChildren();
      if (!futurePlans.length) { const empty = document.createElement('div'); empty.className = 'future-empty'; empty.textContent = '暂无未来价格计划'; list.append(empty); return; }
      const tableWrap = document.createElement('div'); tableWrap.className = 'future-table';
      tableWrap.innerHTML = '<table><thead><tr><th>生效日期</th><th>地区数量</th><th>生效范围</th><th>操作</th></tr></thead><tbody></tbody></table>';
      const tbody = tableWrap.querySelector('tbody');
      futurePlans.forEach((plan, index) => {
        const tr = document.createElement('tr');
        const scope = plan.scope === 'all' ? '对新老订阅用户都生效' : '仅对新订阅用户生效';
        tr.innerHTML = '<td>' + (plan.date || '未设置') + '</td><td>' + plan.regions.length + ' 个地区</td><td>' + scope + '</td><td><div class="future-actions"><button class="link-button view-plan" type="button">查看详情</button><button class="link-button edit-plan" type="button">编辑</button><button class="link-button delete delete-plan" type="button">删除</button></div></td>';
        tr.querySelector('.view-plan').addEventListener('click', () => openFutureDetail(plan));
        tr.querySelector('.edit-plan').addEventListener('click', () => openFutureDialog(plan));
        tr.querySelector('.delete-plan').addEventListener('click', () => { futurePlans.splice(index, 1); renderAll(); saveDraft(); });
        tbody.append(tr);
      });
      list.append(tableWrap);
    }
    function templates() { try { return JSON.parse(localStorage.getItem(templateKey)) || {}; } catch (_) { return {}; } }
    function openFutureDetail(plan) {
      const content = document.getElementById('future-detail-content');
      content.innerHTML = '<div class="detail-meta"></div><h3 class="detail-heading">预付默认价格</h3><div class="detail-meta default-detail"></div><h3 class="detail-heading">商品价格</h3><div class="table-scroll"><table><thead><tr><th>地区</th><th>货币代码</th><th>货币符号</th><th>商品原价</th><th>实际价格</th><th>当前实际价格</th></tr></thead><tbody></tbody></table></div>';
      const addDetail = (container, label, value) => {
        const item = document.createElement('div'); item.className = 'detail-item';
        const name = document.createElement('span'); name.textContent = label;
        const data = document.createElement('span'); data.textContent = value;
        item.append(name, data); container.append(item);
      };
      const meta = content.querySelector('.detail-meta');
      addDetail(meta, '价格开始生效日期：', plan.date || '未设置');
      addDetail(meta, '价格生效范围：', plan.scope === 'all' ? '对新老订阅用户都生效' : '仅对新订阅用户生效');
      const defaults = content.querySelector('.default-detail');
      const base = plan.defaults[plan.baseCurrency] || {};
      addDetail(defaults, '货币符号：', plan.baseCurrency + ' (' + currencies[plan.baseCurrency].symbol + ')');
      addDetail(defaults, '商品原价：', base.original || '未设置');
      addDetail(defaults, '实际价格：', base.actual || '未设置');
      const tbody = content.querySelector('tbody');
      plan.regions.forEach(row => {
        const currentRow = currentPlan.regions.find(item => item.name === row.name);
        const currentActual = currentRow?.actual || currentPlan.defaults[currentPlan.baseCurrency]?.actual || '未设置';
        const tr = document.createElement('tr');
        [row.name, row.code, currencies[row.code].symbol, row.original || '未设置', row.actual || '未设置', currentActual].forEach(value => {
          const td = document.createElement('td'); td.textContent = value; tr.append(td);
        });
        tbody.append(tr);
      });
      document.getElementById('future-detail-dialog').showModal();
    }
    let editingPlan = null;
    function openFutureDialog(plan) {
      editingPlan = plan;
      const editor = document.getElementById('future-editor'); editor.replaceChildren();
      renderPlan(editor, plan, futurePlans.indexOf(plan) + 1, true);
      document.getElementById('future-dialog-title').textContent = futurePlans.includes(plan) ? '编辑未来价格计划' : '添加未来价格计划';
      document.getElementById('future-dialog').showModal();
    }
    document.getElementById('add-future').addEventListener('click', () => {
      if (futurePlans.some(plan => !plan.date)) return say('请先填写已有未来价格计划的开始日期');
      openFutureDialog(makePlan());
    });
    document.addEventListener('pointerdown', event => { if (!menu.contains(event.target) && event.target !== activeInput) closeMenu(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
    window.addEventListener('scroll', closeMenu, true);
    document.getElementById('template-cancel').addEventListener('click', () => document.getElementById('template-dialog').close());
    document.getElementById('future-detail-close').addEventListener('click', () => document.getElementById('future-detail-dialog').close());
    document.getElementById('future-cancel').addEventListener('click', () => { document.getElementById('future-dialog').close(); editingPlan = null; });
    document.getElementById('future-save').addEventListener('click', () => {
      const plan = editingPlan; if (!plan) return;
      const dateInput = document.querySelector('#future-editor .plan-date');
      const error = document.querySelector('#future-editor .date-error');
      if (!plan.date) { dateInput.classList.add('invalid'); error.textContent = '请选择价格开始生效日期'; return; }
      if (futurePlans.some(item => item !== plan && item.date === plan.date)) { dateInput.classList.add('invalid'); error.textContent = '同一日期只允许有一条价格计划'; return; }
      const priceError = validPlan(plan);
      if (priceError) return say(priceError);
      if (!futurePlans.includes(plan)) futurePlans.push(plan);
      document.getElementById('future-dialog').close(); editingPlan = null; renderAll(); saveDraft();
    });
    document.getElementById('template-confirm').addEventListener('click', () => { const name = document.getElementById('template-name').value.trim(); if (!name) return say('请输入模板名称'); const data = templates(); data[name] = { defaults: structuredClone(activePlan.defaults), regions: activePlan.regions.map(row => ({ name: row.name, original: row.original, actual: row.actual })) }; localStorage.setItem(templateKey, JSON.stringify(data)); document.getElementById('template-dialog').close(); say('模板已保存'); });
    document.getElementById('back').addEventListener('click', () => { location.href = './个人会员商品列表.html'; });
    document.getElementById('previous').addEventListener('click', () => { location.href = './添加商品-审核信息.html'; });
    function validPlan(plan) {
      const valid = value => /^\d+(\.\d{1,2})?$/.test(value) && Number(value) > 0;
      const base = plan.defaults[plan.baseCurrency];
      if (!base || !valid(base.actual)) return '请填写有效的默认实际价格';
      if (base.original && !valid(base.original)) return '请填写有效的默认商品原价';
      if (plan.regions.some(row => (row.original && !valid(row.original)) || (row.actual && !valid(row.actual)))) return '请检查地区价格，需填写大于 0 的数字';
      return '';
    }
    document.getElementById('next').addEventListener('click', () => {
      const currentError = validPlan(currentPlan);
      if (currentError) return say('当前价格：' + currentError);
      const seenDates = new Set();
      for (let index = 0; index < futurePlans.length; index++) {
        const plan = futurePlans[index];
        if (!plan.date) return say('未来价格计划请补充价格开始生效日期');
        if (seenDates.has(plan.date)) return say('未来价格计划的开始日期不能重复');
        seenDates.add(plan.date);
        if (!plan.scope) return say('请选择价格生效范围');
        const futureError = validPlan(plan);
        if (futureError) return say('未来价格计划 ' + plan.date + '：' + futureError);
      }
      saveDraft(); say('价格信息已保存');
    });

    try {
      const saved = JSON.parse(localStorage.getItem(dataKey));
      if (saved) {
        const current = saved.currentPlan || { baseCurrency: saved.baseCurrency, defaults: saved.defaultPrices, regions: saved.regions };
        if (current.baseCurrency in currencies) currentPlan.baseCurrency = current.baseCurrency;
        Object.assign(currentPlan.defaults, current.defaults || {});
        (current.regions || []).forEach(item => { const row = currentPlan.regions.find(region => region.name === item.name); if (row) Object.assign(row, { original: item.original || '', actual: item.actual || '' }); });
        (saved.futurePlans || []).forEach(item => { if (item && Array.isArray(item.regions) && item.defaults) futurePlans.push({ ...item, scope: 'new' }); });
      }
    } catch (_) { /* Ignore outdated local draft. */ }
    renderAll();
  </script>
</body>
</html>
